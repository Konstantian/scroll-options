name: build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 make

      - name: Build
        run: |
          make VERSION="$VERSION"
          mv scroll-options.exe "scroll-options-$VERSION-$ARCH.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: scroll-options-${{ env.VERSION }}-${{ env.ARCH }}
          path: scroll-options-${{ env.VERSION }}-${{ env.ARCH }}.exe

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" "scroll-options-$VERSION-$ARCH.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
